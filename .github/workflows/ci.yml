name: CI
on: [push, pull_request]
concurrency:
  group: atlas-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.6@sha256:bd67306b6cc77c98122cada2321eb60b20d00b19d26cb61c86681e7bd5951498
        ports: ["6333:6333"]
    env:
      QDRANT_TEST_URL: http://localhost:6333
      QDRANT_URL: http://localhost:6333
      DOCS_ROOT: ${{ github.workspace }}/examples
      STATE_ROOT: /tmp/atlas-ci-state
      COLLECTION: atlas_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Audit authored history rather than GitHub's synthetic PR merge metadata.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime and dependencies
        run: |
          pip install pip==26.2.1 setuptools==84.0.0
          pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Static checks
        run: |
          ruff check atlas_rag tests integrations
          bandit -r atlas_rag integrations
          python scripts/check_secrets.py --history
      - name: Dependency audit
        run: pip-audit
      - name: Real Qdrant and provider protocol tests
        run: pytest -q
      - name: Measured multilingual retrieval
        run: python -m atlas_rag.evaluate --output /tmp/results.json --reranker cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retrieval-evaluation
          path: /tmp/results.json
      - name: Build and run authenticated Docker demo
        run: |
          python scripts/configure_demo.py
          docker compose up -d --build
          python scripts/demo.py
      - name: Stop demo
        if: always()
        run: |
          if [ -f .env ]; then docker compose down -v; fi
