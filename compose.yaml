services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      DOCS_ROOT: /data
      HF_HOME: /tmp/atlas-huggingface
    volumes:
      - ./examples:/data:ro
      - model-cache:/home/atlas/.cache
    depends_on:
      - qdrant
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
volumes:
  qdrant-data:
  model-cache:
