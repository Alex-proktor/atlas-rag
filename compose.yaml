services:
  api:
    build: .
    image: atlas-rag:0.2.2-cpu
    ports:
      - "127.0.0.1:${ATLAS_PORT:-8000}:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      DOCS_ROOT: /data
      STATE_ROOT: /home/atlas/state
      HF_HOME: /home/atlas/.cache/huggingface
      ATLAS_IDENTITIES: ${ATLAS_IDENTITIES:?Set ATLAS_IDENTITIES as documented in README}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_ALLOW_EXTERNAL: ${LLM_ALLOW_EXTERNAL:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
    volumes:
      - ./examples:/data:ro
      - model-cache:/home/atlas/.cache
      - index-state:/home/atlas/state
    depends_on:
      - qdrant
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  qdrant-data:
  model-cache:
  index-state:
