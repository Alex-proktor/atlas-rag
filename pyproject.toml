[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-rag"
version = "0.1.0"
description = "Local-first, provider-neutral cited document retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "qdrant-client>=1.12,<1.14", "sentence-transformers>=3,<6", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["atlas_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
