[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-rag"
version = "0.2.0"
description = "Provider-neutral, access-controlled corporate knowledge retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<1", "uvicorn>=0.34,<1",
  "qdrant-client==1.13.3", "sentence-transformers>=3.4,<6",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "filelock>=3.18,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "bandit>=1.8,<2", "pip-audit>=2.9,<3"]
evaluation = ["ragas>=0.4,<0.5"]

[tool.setuptools.packages.find]
include = ["atlas_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
